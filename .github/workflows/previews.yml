name: Previews

# A preview Worker per pull request, so a change can be tried on a phone before
# it merges. Nothing here is needed to run the app; production is deployed by
# ci.yml. The jobs sit themselves out until the repository has the
# CLOUDFLARE_WORKERS_SUBDOMAIN variable (the README's Deploy section says how
# to set it up), so a fork inherits this file without harm.
#
# A preview is a whole Worker of its own, `backseatbingo-pr-<number>` on the
# account's workers.dev subdomain, deployed from wrangler.jsonc's `preview`
# env. Rooms are Durable Objects, which belong to the Worker that declares
# them, so each preview has rooms of its own and production's are untouched.
# Rate-limit counters are account-wide, so the env gives previews their own.
# There is no database or bucket to share.

on:
  pull_request:
    # `closed` is here only so a merged or abandoned PR's Worker gets deleted;
    # the preview job sits it out. Naming it means naming the default three.
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  preview:
    name: Deploy a preview Worker
    # Same-repository PRs only: a fork's PR cannot read the secrets anyway.
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.CLOUDFLARE_WORKERS_SUBDOMAIN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    # A newer push to the same PR supersedes the deploy in progress.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      WORKER_NAME: backseatbingo-pr-${{ github.event.pull_request.number }}
      PREVIEW_URL: https://backseatbingo-pr-${{ github.event.pull_request.number }}.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      # Same build as production, tip link included, so the preview is what
      # would ship.
      - run: pnpm build
        env:
          VITE_TIP_URL: ${{ secrets.VITE_TIP_URL }}

      # `--name` points the deploy at the preview's own Worker. The env has no
      # routes whatever production has, so the workers.dev address is the
      # Worker's only one.
      # The token is scoped to this step, so install scripts and the PR's own
      # build code never see it.
      - run: pnpm exec wrangler deploy --env preview --name "$WORKER_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment the preview URL
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- backseatbingo-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `### Preview: ${process.env.PREVIEW_URL}`,
              '',
              'Rooms on this preview are its own; production is untouched.',
              'The Worker is deleted when this PR closes.',
              '',
              // Which push the URL is serving, so a stale comment and a fresh
              // one do not look identical while a redeploy is still running.
              `<sub>Worker \`${process.env.WORKER_NAME}\` · deployed ${sha}</sub>`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  teardown:
    name: Delete the preview Worker
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.CLOUDFLARE_WORKERS_SUBDOMAIN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Shares the PR's group so a deploy still in flight is cancelled first.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      WORKER_NAME: backseatbingo-pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # One API call, no checkout, no install, no wrangler. The PR's branch may
      # be gone by now, and wrangler's own `delete` also lists KV namespaces to
      # tidy up, which needs a KV permission the deploy token does not have and
      # this app never will. `force=true` deletes the Worker's Durable Object
      # namespaces with it, which is the point: a closed PR's rooms have
      # nothing to live for. Error 10007 is "no such Worker", which a PR that
      # never deployed a preview is allowed to hit.
      - run: |
          code="$(curl -sS --max-time 60 -o "$RUNNER_TEMP/delete.json" -w '%{http_code}' -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME?force=true" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          if [ "$code" = 200 ]; then
            echo "Deleted $WORKER_NAME and its Durable Objects."
          elif jq -e '.errors[]? | select(.code == 10007)' "$RUNNER_TEMP/delete.json" >/dev/null 2>&1; then
            echo "::notice::No Worker named $WORKER_NAME. This PR never deployed a preview."
          else
            echo "::error::Deleting $WORKER_NAME failed with HTTP $code."
            cat "$RUNNER_TEMP/delete.json"
            exit 1
          fi
