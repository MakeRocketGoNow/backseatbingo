name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # package.json has no packageManager field, so pin the major here.
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # The build script runs typecheck first, so this covers both.
      - run: pnpm build
