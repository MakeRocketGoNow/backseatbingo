name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR makes the older run moot. On main every push
# gets its own group, so every commit is checked; only the deploy job below
# runs one at a time.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - run: pnpm test

      # The build script runs typecheck first, so this covers both.
      - run: pnpm build

  # Every push to main that passes the checks goes live. Needs two repository
  # secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; the job fails at
  # the deploy step until they exist. VITE_TIP_URL is optional: unset, the
  # winner screen's tip line is hidden rather than built with the placeholder.
  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A stuck deploy would otherwise hold production-deploy for six hours.
    timeout-minutes: 15
    environment: production
    # A deploy in progress is never cancelled halfway, and GitHub keeps one
    # waiting run per group, so deploys that pile up collapse into the last to
    # arrive. Checks run in parallel, though, so that can be an older commit;
    # the first step below makes such a deploy skip itself.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # Runs while the job holds the group. If main has moved on, the newer
      # commit's own run deploys it; deploying this one would roll production
      # back. When that newer run's check fails, production stays on the last
      # good deploy, which is right while main is red.
      - name: Skip if main has moved on
        id: tip
        run: |
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $tip now; leaving the deploy to that run."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tip.outputs.stale != 'true'
        uses: ./.github/actions/setup

      - if: steps.tip.outputs.stale != 'true'
        run: pnpm build
        env:
          VITE_TIP_URL: ${{ secrets.VITE_TIP_URL }}

      - if: steps.tip.outputs.stale != 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
